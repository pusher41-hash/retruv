name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  checks:
    name: Typecheck, lint, unit tests, build
    runs-on: ubuntu-latest
    env:
      # Never a real target, and nothing in this job ever actually connects
      # to it — `src/db/index.ts` only needs a syntactically valid
      # DATABASE_URL to construct its (lazily-connecting) pg.Pool at module
      # load time, which every unit test and the build both trigger simply
      # by importing modules that import `@/db`. RETRUV_ENC_KEY must decode
      # to exactly 32 bytes (AES-256) — this one does, it's not otherwise
      # meaningful. Real secrets live only in Vercel's env vars.
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/retruv_ci
      RETRUV_ENC_KEY: MDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDA=
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npx eslint .
      - run: npm test
      - run: npm run build

  integration:
    name: Integration tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: retruv_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          # Temporarily bumped from 22 to 24 to test whether the CI-only
          # "Cannot use public access on a private store" Blob error
          # (env vars confirmed identical to local via prior diagnostics)
          # is a Node-version-specific difference — local dev runs on 24.
          node-version: 24
          cache: npm
      - run: npm ci
      # `db:push:test` runs drizzle-kit interactively when it detects an
      # ambiguous change (rare against a brand-new empty DB, but not
      # impossible) — `yes` auto-confirms so this never hangs the runner.
      - run: yes | npx drizzle-kit push --config drizzle.test.config.json
      - name: Diagnose Blob env vars (temporary)
        run: |
          node -e "
          const pub = process.env.BLOB_PUBLIC_STORE_ID || '';
          const priv = process.env.BLOB_PRIVATE_STORE_ID || '';
          const tok = process.env.BLOB_READ_WRITE_TOKEN || '';
          console.log('PUBLIC_STORE_ID length:', pub.length, 'matches expected:', pub === 'store_auMuHPRCzI0loqW6');
          console.log('PRIVATE_STORE_ID length:', priv.length, 'matches expected:', priv === 'store_mi6zospZHXmp55iE');
          console.log('TOKEN length:', tok.length, 'starts with vercel_blob_rw_:', tok.startsWith('vercel_blob_rw_'));
          "
        env:
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
          BLOB_PRIVATE_STORE_ID: ${{ secrets.BLOB_PRIVATE_STORE_ID }}
          BLOB_PUBLIC_STORE_ID: ${{ secrets.BLOB_PUBLIC_STORE_ID }}
      - run: npm run test:integration
        env:
          # CI-only throwaway values — this Postgres service and its data
          # are destroyed at the end of the run, never anything real. Real
          # secrets (prod DATABASE_URL, RETRUV_ENC_KEY, webhook URLs) live
          # only in Vercel's env vars, never in this repo or its CI.
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/retruv_test
          RETRUV_ENC_KEY: MDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDA=
          # Surfaces the spawned `next dev` server's own stdout/stderr in the
          # CI log — otherwise a route handler's 500 shows only as an HTTP
          # status in the test assertion, with the actual stack trace
          # silently discarded (global-setup.ts sets stdio: "ignore" unless
          # this is set). Temporary diagnostic aid, safe to leave on.
          DEBUG_TEST_SERVER: "1"
          # Dedicated retruv-test-private / retruv-test-public Vercel Blob
          # stores — never the production stores. storage.ts/audit-trail.ts
          # always pass storeId explicitly, so nothing the suite does here
          # can reach real prod data even if this token were ever reused.
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
          BLOB_PRIVATE_STORE_ID: ${{ secrets.BLOB_PRIVATE_STORE_ID }}
          BLOB_PUBLIC_STORE_ID: ${{ secrets.BLOB_PUBLIC_STORE_ID }}
